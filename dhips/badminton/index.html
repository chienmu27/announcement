<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球隊公告查詢系統</title>

    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 15px; position: relative; }
        
        /* 重新整理按鈕樣式 */
        .refresh-btn { 
            background: #28a745; color: white; border: none; padding: 8px 15px; 
            border-radius: 5px; cursor: pointer; float: right; font-size: 14px;
            transition: background 0.3s;
        }
        .refresh-btn:hover { background: #218838; }
        .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 分頁按鈕樣式 */
        .tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; clear: both; }
        .tab-btn { 
            padding: 10px 20px; border: none; background: #e9ecef; cursor: pointer; 
            border-radius: 5px 5px 0 0; font-weight: bold; transition: 0.3s;
        }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-btn:hover { background: #dee2e6; }

        /* 查詢控制區塊 */
        .controls { margin-bottom: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ced4da; box-sizing: border-box; }
        .select-group { margin-bottom: 15px; }
        .select-group:last-child { margin-bottom: 0; }
        
        /* 直式表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid #dee2e6; }
        th, td { border: 1px solid #dee2e6; padding: 12px 15px; text-align: left; }
        th { background: #f1f3f5; color: #495057; width: 35%; white-space: nowrap; }
        td { background: white; color: #333; font-weight: 500; min-height: 24px; }
        
        .result-block { margin-bottom: 30px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .no-data { text-align: center; padding: 40px; color: #6c757d; font-size: 18px; }
        .status-msg { text-align: center; font-size: 0.9em; color: #888; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <button id="refreshBtn" class="refresh-btn" onclick="reloadData()">🔄 重新整理資料</button>
    <h1>羽球隊查詢系統</h1>
    
    <div id="userView">
        <div id="mainContent">
            <!-- 分頁按鈕區域 -->
            <div id="tabBar" class="tab-container"></div>

            <div class="controls">
                <!-- 第一步：選擇年級 -->
                <div class="select-group">
                    <label id="gradeLabel" for="gradeSelect">1. 請選擇年級：</label>
                    <select id="gradeSelect">
                        <option value="">-- 全部年級 --</option>
                    </select>
                </div>

                <!-- 第二步：選擇學生姓名 -->
                <div class="select-group">
                    <label id="selectLabel" for="dataSelect">2. 請選擇學生姓名：</label>
                    <select id="dataSelect">
                        <option value="">-- 請選擇學生姓名 --</option>
                    </select>
                </div>
            </div>

            <div id="resultArea">
                <div class="no-data">正在連線讀取資料，請稍候...</div>
            </div>
        </div>

        <div class="status-msg" id="statusMsg">資料來源：東海國小羽球隊</div>
    </div>
</div>

<script>
    // ⚠️ 請填入您部署後的 GAS 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwONQR7Ys4cp799bAD0W7UjLkfIv4iIBhVuwvSMKiSJiYslpLds5oTGQ3ISm50dhDw/exec";

    let fullData = {};
    let currentSheet = "";

    // 年級排序順序參考
    const GRADE_ORDER = ["一年級", "二年級", "三年級", "四年級", "五年級", "六年級", "七年級", "八年級", "九年級"];

    // 初始化
    async function init() {
        await loadDataFromServer();
    }

    // 從後端撈取試算表資料
    async function loadDataFromServer() {
        const refreshBtn = document.getElementById("refreshBtn");
        const resArea = document.getElementById("resultArea");
        
        refreshBtn.disabled = true;
        refreshBtn.textContent = "更新中...";

        try {
            const response = await fetch(API_URL + "?t=" + new Date().getTime());
            const json = await response.json();
            fullData = json.data;

            const sheetNames = Object.keys(fullData);
            if (sheetNames.length > 0) {
                // 如果是首次載入或原工作表不存在，預設第一個工作表
                if (!currentSheet || !fullData[currentSheet]) {
                    currentSheet = sheetNames[0];
                }
                
                renderTabs();

                // 記住更新前的年級與學生選擇
                const prevGrade = document.getElementById("gradeSelect").value;
                const prevStudent = document.getElementById("dataSelect").value;

                // 建立年級下拉選單
                renderGradeDropdown(currentSheet);

                // 若之前選擇的年級依然存在，則保留該選項
                if (prevGrade && isOptionExists("gradeSelect", prevGrade)) {
                    document.getElementById("gradeSelect").value = prevGrade;
                }

                // 根據年級渲染學生名單
                renderStudentDropdown(currentSheet, document.getElementById("gradeSelect").value);

                // 若之前選擇的學生依然存在，則保留並直接刷新資料
                if (prevStudent && isOptionExists("dataSelect", prevStudent)) {
                    document.getElementById("dataSelect").value = prevStudent;
                    displayStudentData(prevStudent);
                } else {
                    resArea.innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
                }
            } else {
                resArea.innerHTML = '<div class="no-data" style="color:red;">找不到任何工作表資料</div>';
            }
        } catch (e) {
            resArea.innerHTML = `<div class="no-data" style="color:red;">連線失敗：${e.message}</div>`;
        } finally {
            refreshBtn.disabled = false;
            refreshBtn.textContent = "🔄 重新整理資料";
        }
    }

    function reloadData() {
        loadDataFromServer();
    }

    function isOptionExists(selectId, value) {
        const select = document.getElementById(selectId);
        return Array.from(select.options).some(opt => opt.value === value);
    }

    // 從 B 欄（班級）字串解析年級
    function parseGrade(classStr) {
        if (!classStr || typeof classStr !== 'string') return "其他 / 未填班級";
        const trimmed = classStr.trim();
        if (!trimmed) return "其他 / 未填班級";

        // 匹配中文年級格式：如「一年一班」、「四年三班」
        const cnMatch = trimmed.match(/^([一二三四五六七八九十]+)年/);
        if (cnMatch) return cnMatch[1] + "年級";

        // 匹配阿拉伯數字年級格式：如「1年4班」、「4年1班」
        const numMatch = trimmed.match(/^([1-9]|1[0-2])年/);
        if (numMatch) {
            const map = { 1:"一年級", 2:"二年級", 3:"三年級", 4:"四年級", 5:"五年級", 6:"六年級" };
            return map[numMatch[1]] || (numMatch[1] + "年級");
        }

        // 匹配三碼班級代碼：如「101」、「403」
        const codeMatch = trimmed.match(/^([1-9])0\d/);
        if (codeMatch) {
            const map = { 1:"一年級", 2:"二年級", 3:"三年級", 4:"四年級", 5:"五年級", 6:"六年級" };
            return map[codeMatch[1]] || "其他 / 未填班級";
        }

        if (trimmed.includes("年級")) return trimmed;
        return "其他 / 未填班級";
    }

    // 1. 動態產生工作表分頁按鈕
    function renderTabs() {
        const tabBar = document.getElementById("tabBar");
        tabBar.innerHTML = "";
        const sheetNames = Object.keys(fullData);
        
        sheetNames.forEach((name) => {
            const btn = document.createElement("button");
            btn.className = "tab-btn" + (name === currentSheet ? " active" : "");
            btn.textContent = name;
            btn.onclick = () => switchTab(name, btn);
            tabBar.appendChild(btn);
        });
    }

    // 切換分頁
    function switchTab(sheetName, btn) {
        currentSheet = sheetName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        renderGradeDropdown(sheetName);
        renderStudentDropdown(sheetName, ""); // 重設為全部年級
        document.getElementById("resultArea").innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
    }

    // 2. 建立年級下拉選單 (依據 B 欄)
    function renderGradeDropdown(sheetName) {
        const gradeSelect = document.getElementById("gradeSelect");
        const rows = fullData[sheetName];
        if (!rows || rows.length < 2) return;

        // 讀取第 2 列開始的 B 欄 (Index 1) 並解析年級
        const gradesSet = new Set();
        rows.slice(1).forEach(row => {
            const className = row[1] ? row[1].toString() : "";
            gradesSet.add(parseGrade(className));
        });

        // 排序年級
        const sortedGrades = Array.from(gradesSet).sort((a, b) => {
            const idxA = GRADE_ORDER.indexOf(a);
            const idxB = GRADE_ORDER.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
        });

        gradeSelect.innerHTML = `<option value="">-- 全部年級 --</option>`;
        sortedGrades.forEach(grade => {
            const opt = document.createElement("option");
            opt.value = grade;
            opt.textContent = grade;
            gradeSelect.appendChild(opt);
        });
    }

    // 年級選單變更事件：連動更新學生清單
    document.getElementById("gradeSelect").addEventListener("change", function() {
        renderStudentDropdown(currentSheet, this.value);
        document.getElementById("resultArea").innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
    });

    // 3. 建立學生下拉選單 (依據 A 欄，並依年級篩選)
    function renderStudentDropdown(sheetName, filterGrade) {
        const dataSelect = document.getElementById("dataSelect");
        const rows = fullData[sheetName];
        if (!rows || rows.length < 2) return;

        // 篩選符合年級的學生列
        const filteredRows = rows.slice(1).filter(row => {
            const name = row[0] ? row[0].toString().trim() : "";
            if (!name) return false;
            if (!filterGrade) return true; // 未選年級則全列
            const className = row[1] ? row[1].toString() : "";
            return parseGrade(className) === filterGrade;
        });

        // 依姓名去重並保留班級資訊供標籤顯示
        const studentMap = new Map();
        filteredRows.forEach(row => {
            const name = row[0].toString().trim();
            const className = row[1] ? row[1].toString().trim() : "";
            if (!studentMap.has(name)) {
                studentMap.set(name, className);
            }
        });

        dataSelect.innerHTML = `<option value="">-- 請選擇學生姓名 --</option>`;
        
        // 排序並填入選項
        Array.from(studentMap.keys()).sort().forEach(name => {
            const className = studentMap.get(name);
            const opt = document.createElement("option");
            opt.value = name;
            // 標籤格式：王○宸 (四年一班)，方便家長快速確認
            opt.textContent = maskName(name) + (className ? ` (${className})` : '');
            dataSelect.appendChild(opt);
        });
    }

    // 4. 學生選單變更事件：渲染查詢結果表格
    document.getElementById("dataSelect").addEventListener("change", function() {
        displayStudentData(this.value);
    });

    function displayStudentData(name) {
        const resArea = document.getElementById("resultArea");
        if (!name) { resArea.innerHTML = '<div class="no-data">請從上方選單選擇學生</div>'; return; }

        const rows = fullData[currentSheet];
        const headers = rows[0]; // 第一列標題列
        const studentRows = rows.slice(1).filter(r => r[0] && r[0].toString().trim() === name);

        let html = "";
        studentRows.forEach(row => {
            html += `<div class="result-block"><table><tbody>`;
            // 遍歷所有標題欄位，包含資料為空的儲存格皆正常顯示
            headers.forEach((label, idx) => {
                let cellValue = (row[idx] !== undefined && row[idx] !== null) ? row[idx].toString().trim() : "";
                
                // 姓名欄位進行個資遮罩
                if (label.toString().includes("姓名")) {
                    cellValue = maskName(cellValue);
                }
                
                html += `
                    <tr>
                        <th>${label || "(未命名欄位)"}</th>
                        <td>${cellValue}</td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
        });
        resArea.innerHTML = html;
    }

    // 姓名遮罩邏輯 (如：王佑宸 -> 王○宸；向加揚 -> 向○揚)
    function maskName(n) {
        if (!n || n.length < 2) return n;
        return n.length === 2 ? n[0] + "○" : n[0] + "○" + n.substring(2);
    }

    // 啟動系統
    init();
</script>

</body>
</html>
