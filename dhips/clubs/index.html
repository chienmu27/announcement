<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社團公告查詢系統</title>

    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 15px; position: relative; }
        
        /* 重新整理按鈕樣式 */
        .refresh-btn { 
            background: #28a745; color: white; border: none; padding: 8px 15px; 
            border-radius: 5px; cursor: pointer; float: right; font-size: 14px;
            transition: background 0.3s;
        }
        .refresh-btn:hover { background: #218838; }
        .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 分頁按鈕樣式 */
        .tab-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; clear: both; }
        .tab-btn { 
            padding: 10px 20px; border: none; background: #e9ecef; cursor: pointer; 
            border-radius: 5px 5px 0 0; font-weight: bold; transition: 0.3s;
        }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-btn:hover { background: #dee2e6; }

        .controls { margin-bottom: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ced4da; }
        
        /* 直式表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid #dee2e6; }
        th, td { border: 1px solid #dee2e6; padding: 12px 15px; text-align: left; }
        th { background: #f1f3f5; color: #495057; width: 35%; white-space: nowrap; }
        td { background: white; color: #333; font-weight: 500; min-height: 24px; }
        
        .result-block { margin-bottom: 30px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .no-data { text-align: center; padding: 40px; color: #6c757d; font-size: 18px; }
        .status-msg { text-align: center; font-size: 0.9em; color: #888; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 10px; }
        .loading-tip { font-size: 0.85em; color: #17a2b8; margin-left: 10px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <button id="refreshBtn" class="refresh-btn" onclick="forceReloadAll()">🔄 強制更新資料</button>
    <h1>社團公告查詢系統 <span id="syncStatus" class="loading-tip"></span></h1>
    
    <div id="userView">
        <div id="mainContent">
            <!-- 分頁按鈕區域 -->
            <div id="tabBar" class="tab-container"></div>

            <div class="controls">
                <label id="selectLabel">請先選擇分頁</label>
                <select id="dataSelect">
                    <option value="">-- 請選擇學生姓名 --</option>
                </select>
            </div>

            <div id="resultArea">
                <div class="no-data">正在載入系統資料，請稍候...</div>
            </div>
        </div>

        <div class="status-msg" id="statusMsg">資料來源：東海國小體育組</div>
    </div>
</div>

<script>
    // ⚠️ 請確認您的 GAS 部署網址
    const API_URL = "https://script.google.com/macros/s/AKfycbxZ-mbXzU0SWO41DwRdMd1V04buWtlsr8Cx-I9ZuglRRUNZs3iziCs_QaREoORAmFjU/exec";
    
    // 儲存所有分頁名稱及已載入的資料
    let sheetList = [];
    let fullData = {}; 
    let currentSheet = "";

    // 1. 初始化進入點
    async function init() {
        // 先讀取本地快取（秒開）
        const cachedNames = localStorage.getItem("LOCAL_SHEET_NAMES");
        const cachedData = localStorage.getItem("LOCAL_FULL_DATA");

        if (cachedNames && cachedData) {
            try {
                sheetList = JSON.parse(cachedNames);
                fullData = JSON.parse(cachedData);
                if (sheetList.length > 0) {
                    currentSheet = sheetList[0];
                    renderTabs();
                    renderDropdown(currentSheet);
                    setTip("（已顯示快取，背景同步中...）");
                }
            } catch (e) {
                console.warn("快取讀取異常", e);
            }
        }

        // 向伺服器讀取清單與第 1 個分頁（大幅縮短讀取時間至 1~2 秒）
        await fetchInitialData();
    }

    // 2. 抓取初始分頁清單與第一個分頁
    async function fetchInitialData(force = false) {
        const resArea = document.getElementById("resultArea");
        try {
            const url = force ? `${API_URL}?nocache=1` : API_URL;
            const res = await fetch(url);
            const json = await res.json();

            sheetList = json.sheetNames || [];
            if (sheetList.length === 0) {
                resArea.innerHTML = '<div class="no-data" style="color:red;">未發現任何可用工作表</div>';
                return;
            }

            // 儲存第 1 個工作表資料
            currentSheet = json.initialSheet;
            fullData[currentSheet] = json.data;

            // 更新本機快取
            localStorage.setItem("LOCAL_SHEET_NAMES", JSON.stringify(sheetList));
            localStorage.setItem("LOCAL_FULL_DATA", JSON.stringify(fullData));

            renderTabs();
            renderDropdown(currentSheet);
            resArea.innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
            setTip("");
        } catch (err) {
            console.error("初始讀取失敗", err);
            if (Object.keys(fullData).length === 0) {
                resArea.innerHTML = `<div class="no-data" style="color:red;">連線失敗：${err.message}</div>`;
            }
        }
    }

    // 3. 點選切換分頁（隨選載入核心）
    async function switchTab(sheetName, btn) {
        currentSheet = sheetName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById("selectLabel").textContent = `請選擇學生姓名 (${sheetName})：`;

        // 如果這個分頁尚未載入，立刻向伺服器非同步抓取
        if (!fullData[sheetName]) {
            const resArea = document.getElementById("resultArea");
            resArea.innerHTML = `<div class="no-data">正在載入【${sheetName}】資料，請稍候...</div>`;
            document.getElementById("dataSelect").innerHTML = `<option value="">載入中...</option>`;
            
            try {
                const res = await fetch(`${API_URL}?sheet=${encodeURIComponent(sheetName)}`);
                const json = await res.json();
                fullData[sheetName] = json.data;
                // 更新儲存
                localStorage.setItem("LOCAL_FULL_DATA", JSON.stringify(fullData));
            } catch (e) {
                resArea.innerHTML = `<div class="no-data" style="color:red;">載入【${sheetName}】失敗：${e.message}</div>`;
                return;
            }
        }

        // 資料已齊全，渲染選單
        renderDropdown(sheetName);
        document.getElementById("resultArea").innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
    }

    // 4. 產生分頁按鈕
    function renderTabs() {
        const tabBar = document.getElementById("tabBar");
        tabBar.innerHTML = "";
        sheetList.forEach(name => {
            const btn = document.createElement("button");
            btn.className = "tab-btn" + (name === currentSheet ? " active" : "");
            btn.textContent = name;
            btn.onclick = () => switchTab(name, btn);
            tabBar.appendChild(btn);
        });
        document.getElementById("selectLabel").textContent = `請選擇學生姓名 (${currentSheet})：`;
    }

    // 5. 產生下拉選單
    function renderDropdown(sheetName) {
        const dataSelect = document.getElementById("dataSelect");
        const rows = fullData[sheetName];
        if (!rows || rows.length < 2) {
            dataSelect.innerHTML = `<option value="">-- 本分頁無資料 --</option>`;
            return;
        }

        // 取得 A 欄 (Index 0) 的學生名單，去重並排序
        const names = [...new Set(rows.slice(1).map(r => r[0]))].filter(n => n).sort();

        dataSelect.innerHTML = `<option value="">-- 請選擇學生姓名 --</option>`;
        names.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = maskName(name);
            dataSelect.appendChild(opt);
        });
    }

    // 6. 監聽選單變更
    document.getElementById("dataSelect").addEventListener("change", function() {
        displayStudentData(this.value);
    });

    // 7. 顯示學生資料（直式表格）
    function displayStudentData(name) {
        const resArea = document.getElementById("resultArea");
        if (!name) {
            resArea.innerHTML = '<div class="no-data">請從上方選單選擇學生</div>';
            return;
        }

        const rows = fullData[currentSheet];
        const headers = rows[0];
        const studentRows = rows.filter(r => r[0] === name);

        let html = "";
        studentRows.forEach(row => {
            html += `<div class="result-block"><table><tbody>`;
            headers.forEach((label, idx) => {
                let cellValue = row[idx] !== undefined ? row[idx].toString().trim() : "";
                if (label.toString().includes("姓名")) {
                    cellValue = maskName(cellValue);
                }
                html += `
                    <tr>
                        <th>${label || "(未命名欄位)"}</th>
                        <td>${cellValue}</td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
        });
        resArea.innerHTML = html;
    }

    // 姓名遮罩
    function maskName(n) {
        if (!n || n.length < 2) return n;
        return n.length === 2 ? n[0] + "○" : n[0] + "○" + n.substring(2);
    }

    // 提示狀態小字
    function setTip(txt) {
        document.getElementById("syncStatus").textContent = txt;
    }

    // 強制重整
    async function forceReloadAll() {
        const btn = document.getElementById("refreshBtn");
        btn.disabled = true;
        btn.textContent = "更新中...";
        localStorage.clear();
        fullData = {};
        await fetchInitialData(true);
        btn.disabled = false;
        btn.textContent = "🔄 強制更新資料";
    }

    // 啟動程式
    init();
</script>

</body>
</html>
